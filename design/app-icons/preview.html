<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Command Center — app icon candidates</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#F4F1EA;color:#29251F;padding:32px}
  h1{font-weight:600;font-size:24px;margin:0 0 4px}
  p{color:#6E6557;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .card{background:#FBFAF6;border:1px solid #E3DCCF;border-radius:14px;padding:20px}
  .name{font-weight:600;font-size:15px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:18px}
  .row img{display:block}
  .dark{margin-top:14px;background:#1C1916;border-radius:12px;padding:14px;display:flex;align-items:center;gap:18px}
  .sz{font-size:11px;color:#9A9183;text-align:center;margin-top:6px}
  figure{margin:0;text-align:center}
</style></head>
<body>
  <h1>Command Center — app icon candidates</h1>
  <p>Four directions, shown at install size (192) and home-screen size (64). Tell me a number and I'll wire it into the PWA.</p>
  <div class="grid">
    <div class="card"><div class="name">1 · Command Ring (radar)</div>
      <div class="row"><figure><img src="01-command-ring.svg" width="120" height="120"/><div class="sz">192</div></figure><figure><img src="01-command-ring.svg" width="64" height="64"/><div class="sz">64</div></figure></div></div>
    <div class="card"><div class="name">2 · Hex Core</div>
      <div class="row"><figure><img src="02-hex-core.svg" width="120" height="120"/><div class="sz">192</div></figure><figure><img src="02-hex-core.svg" width="64" height="64"/><div class="sz">64</div></figure></div></div>
    <div class="card"><div class="name">3 · Beacon (signal)</div>
      <div class="row"><figure><img src="03-beacon.svg" width="120" height="120"/><div class="sz">192</div></figure><figure><img src="03-beacon.svg" width="64" height="64"/><div class="sz">64</div></figure></div></div>
    <div class="card"><div class="name">4 · Aperture</div>
      <div class="row"><figure><img src="04-aperture.svg" width="120" height="120"/><div class="sz">192</div></figure><figure><img src="04-aperture.svg" width="64" height="64"/><div class="sz">64</div></figure></div></div>
  </div>
</body></html>
