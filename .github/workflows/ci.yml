name: OpenOcti CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    name: Public boundary and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public repository boundary
        run: node scripts/verify-openocti-boundary.mjs .
      - name: Scan public source for secrets
        # Official Gitleaks v8.30.1 OCI index; pin the scanner, not a mutable tag.
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/openocti-gitleaks.toml"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/openocti-gitleaks.toml:/scan-config.toml:ro" \
            "$GITLEAKS_IMAGE" dir /repo \
            --config /scan-config.toml --gitleaks-ignore-path /no-repository-ignores \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code 1

  verify:
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: docker build --tag openocti-ci .
      - name: Verify fresh keyless container runtime
        timeout-minutes: 5
        run: node scripts/smoke-openocti-container.mjs openocti-ci
      - name: Remove disposable smoke containers and volumes
        if: always()
        run: |
          docker ps -aq --filter label=openocti.ci-smoke=true | xargs -r docker rm -f
          docker volume ls -q --filter label=openocti.ci-smoke=true | xargs -r docker volume rm
