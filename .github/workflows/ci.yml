name: OpenOcti CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: docker build --tag openocti-ci .
      - name: Verify fresh keyless container runtime
        timeout-minutes: 5
        run: node scripts/smoke-openocti-container.mjs openocti-ci
      - name: Remove disposable smoke containers and volumes
        if: always()
        run: |
          docker ps -aq --filter label=openocti.ci-smoke=true | xargs -r docker rm -f
          docker volume ls -q --filter label=openocti.ci-smoke=true | xargs -r docker volume rm
