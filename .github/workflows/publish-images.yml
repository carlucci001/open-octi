name: Publish images to GHCR

# Builds and publishes both OpenOcti container images to GitHub Packages:
#   ghcr.io/carlucci001/open-octi            (the Next.js app, ./Dockerfile)
#   ghcr.io/carlucci001/open-octi-openclaw   (the OpenClaw sidecar, ./deploy/openclaw/Dockerfile)
#
# Tags produced:
#   v1.2.3 tag  ->  1.2.3, 1.2, latest
#   push to main -> edge
#   every build  -> sha-<short commit>
#
# Images are multi-arch (amd64 + arm64) using native runners per platform,
# so the Next.js build is never emulated under QEMU.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  boundary:
    name: Image publication boundary and secret scan
    if: github.repository == 'carlucci001/open-octi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public repository boundary
        run: node scripts/verify-openocti-boundary.mjs .
      - name: Scan public source for secrets
        # Official Gitleaks v8.30.1 OCI index; pin the scanner, not a mutable tag.
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/openocti-gitleaks.toml"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/openocti-gitleaks.toml:/scan-config.toml:ro" \
            "$GITLEAKS_IMAGE" dir /repo \
            --config /scan-config.toml --gitleaks-ignore-path /no-repository-ignores \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code 1

  build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: boundary
    if: github.repository == 'carlucci001/open-octi' && needs.boundary.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: open-octi
            dockerfile: Dockerfile
          - name: open-octi-openclaw
            dockerfile: deploy/openclaw/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            FCC_EDITION=openocti
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo -n > "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    needs: [boundary, build]
    if: github.repository == 'carlucci001/open-octi' && needs.boundary.result == 'success' && needs.build.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [open-octi, open-octi-openclaw]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}--*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${OWNER}/${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ matrix.image }}

      - name: Inspect
        run: docker buildx imagetools inspect "${REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
